# release-kit: a new kit release arrives as update PRs (the dev dependency and the workflow pins).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: release-kit
    # Dependabot misorders this git dependency's tags and once proposed
    # v2.0.0 -> v1.0.3; never offer anything older than the current major.
    ignore:
      - dependency-name: release-kit
        versions: ["< 2"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: n8watkins/release-kit*
