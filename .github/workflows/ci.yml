# Checks for every pull request and every push to main: lint, typecheck, the
# unit and workerd/D1 integration tests, a production build, and browser tests.
#
# Commit messages are checked by commits.yml (release-kit), not here.
#
# Deploys are in deploy.yml (the canonical install only, after this passes on
# main). wrangler.jsonc is the public template (no database id, the template's
# vars), so other installs deploy from their own machine (`npm run deploy:prod`,
# docs/INSTALL.md) or with Workers Builds (the Deploy to Cloudflare button).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets the release-kit train run it on a release commit

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: release-kit check (warns when the kit or workflow pins are out of date)
        run: npx release-kit check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (workerd + D1)
        run: npm run test:integration
      - run: npm run build

  e2e:
    # The admin app in headless Chromium against the built Worker under
    # `wrangler dev` on a throwaway local D1 database (e2e/serve.mjs).
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The landing page's waitlist form posts to the canonical install unless told otherwise;
      # the browser tests point it at the Worker they run (e2e/serve.mjs).
      - run: npm run build
        env:
          VITE_WAITLIST_URL: /api/waitlist
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
