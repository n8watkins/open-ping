<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="color-scheme" content="dark" />
    <!--
      This page shows only its own constant screens. 'unsafe-inline' is for
      Capacitor's bridge, which older Android WebViews receive as an inline
      script, and for the styles Vite's preview (npx vite) inlines. Every
      other source is this app's own files.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>OpenPing</title>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
